name: OpenCV OOB Testing Pipeline

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test_pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest opencv-python-headless
         
    - name: Run Functional Tests
      run: |
        pytest tests/functional/ -v --junitxml=reports/functional.xml

    - name: Run Performance Tests
      run: |
        pytest tests/performance/ -v -s --junitxml=reports/performance.xml

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          reports/
          tests/performance/results_*.json

    - name: Generate test summary
      if: always()
      run: |
        echo "## Wyniki testow OpenCV OOB" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### Testy funkcjonalne" >> $GITHUB_STEP_SUMMARY
        if [ -f reports/functional.xml ]; then
          TOTAL=$(grep -oP 'tests="\K[0-9]+' reports/functional.xml | head -1)
          FAIL=$(grep -oP 'failures="\K[0-9]+' reports/functional.xml | head -1)
          ERR=$(grep -oP 'errors="\K[0-9]+' reports/functional.xml | head -1)
          PASS=$((TOTAL - FAIL - ERR))
          echo "| Metryka | Wartosc |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lacznie | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Zaliczone | $PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| Niezaliczone | $FAIL |" >> $GITHUB_STEP_SUMMARY
          echo "| Bledy | $ERR |" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### Testy wydajnosciowe" >> $GITHUB_STEP_SUMMARY
        if [ -f tests/performance/results_processing.json ]; then
          echo "**Procesowanie duzych macierzy:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat tests/performance/results_processing.json >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f tests/performance/results_io.json ]; then
          echo "**Benchmark I/O:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat tests/performance/results_io.json >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
