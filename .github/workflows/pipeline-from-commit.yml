name: OpenCV Build from Commit

on:
  workflow_dispatch:
    inputs:
      opencv_commit:
        description: 'SHA commita z repozytorium opencv/opencv-python'
        required: true
        default: 'HEAD'
        type: string

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout our repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential pkg-config
        python -m pip install --upgrade pip
        pip install numpy setuptools wheel scikit-build
        pip install pytest

    - name: Clone and checkout opencv-python
      run: |
        git clone --recursive https://github.com/opencv/opencv-python.git /tmp/opencv-python
        cd /tmp/opencv-python
        COMMIT="${{ github.event.inputs.opencv_commit }}"
        if [ "$COMMIT" != "HEAD" ]; then
          git checkout "$COMMIT"
          git submodule update --init --recursive
        fi
        echo "Building opencv-python from commit: $(git rev-parse HEAD)"

    - name: Build opencv-python from source
      run: |
        cd /tmp/opencv-python
        export CMAKE_ARGS="-DBUILD_LIST=core,imgproc,imgcodecs"
        pip install . --verbose
      env:
        ENABLE_HEADLESS: 1

    - name: Verify installation
      run: |
        python -c "import cv2; print(f'OpenCV version: {cv2.__version__}')"

    - name: Run Functional Tests
      run: |
        pytest tests/functional/ -v --junitxml=reports/functional.xml

    - name: Run Performance Tests
      run: |
        pytest tests/performance/ -v -s --junitxml=reports/performance.xml

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-from-commit
        path: |
          reports/
          tests/performance/results_*.json

    - name: Generate test summary
      if: always()
      run: |
        echo "## Wyniki testow - Build from commit" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** \`${{ github.event.inputs.opencv_commit }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        BUILT_VER=$(python -c "import cv2; print(cv2.__version__)" 2>/dev/null || echo "build failed")
        echo "**Zbudowana wersja OpenCV:** \`$BUILT_VER\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### Testy funkcjonalne" >> $GITHUB_STEP_SUMMARY
        if [ -f reports/functional.xml ]; then
          TOTAL=$(grep -oP 'tests="\K[0-9]+' reports/functional.xml | head -1)
          FAIL=$(grep -oP 'failures="\K[0-9]+' reports/functional.xml | head -1)
          ERR=$(grep -oP 'errors="\K[0-9]+' reports/functional.xml | head -1)
          PASS=$((TOTAL - FAIL - ERR))
          echo "| Metryka | Wartosc |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lacznie | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Zaliczone | $PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| Niezaliczone | $FAIL |" >> $GITHUB_STEP_SUMMARY
          echo "| Bledy | $ERR |" >> $GITHUB_STEP_SUMMARY
        fi
